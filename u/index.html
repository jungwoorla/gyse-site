<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-SMncyEfrlxHT48QSHYFJzS+WbIKkp8IV1DOkP6LZrwY='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Follow on GYSE</title>
<meta name="description" content="Strength, as an index. Follow a friend's GYSE ticker.">
<meta property="og:title" content="Follow me on GYSE">
<meta property="og:description" content="I track my strength as an index. Follow my line on GYSE.">
<meta property="og:image" content="https://gyse.app/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F1F1F3">
<style>
  @font-face { font-family: "Archivo"; src: url(/assets/fonts/archivo-var.woff2) format("woff2-variations"), url(/assets/fonts/archivo-var.woff2) format("woff2");
               font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root { --chalk:#F1F1F3; --ink:#141317; --slate:#5F5C68; --rule:rgba(20,19,23,.12); --violet:#6C47F0; --violet-ink:#5734D9; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: var(--chalk); color: var(--ink);
         font: 17px/1.6 "Archivo", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 4px; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 22px 56px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 650; font-size: 18px; letter-spacing: .01em; }
  .brand svg { width: 24px; height: 24px; }
  .line { display: block; width: 100%; height: auto; margin: 56px 0 28px; overflow: visible; }
  .ticker { font-stretch: 72%; font-weight: 500; font-size: clamp(56px, 17vw, 84px); line-height: 1; letter-spacing: -.01em; margin: 0; word-break: break-all; }
  p { color: var(--slate); margin: 14px 0 0; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; text-decoration: none; font-weight: 600; margin-top: 12px; }
  .primary { background: var(--violet); color: #fff; margin-top: 32px; }
  .primary:hover { background: var(--violet-ink); }
  .secondary { border: 1px solid var(--rule); color: var(--ink); }
  .note { font-size: 14px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" aria-label="GYSE home">
    <svg viewBox="0 0 1024 1024" fill="none" stroke="#6C47F0" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M224 720 L418 482 L580 600 L798 304 M642 304 L798 304 L798 460"/></svg>
    GYSE
  </a>
  <svg class="line" viewBox="0 0 436 140" aria-hidden="true">
    <line x1="0" x2="436" y1="124" y2="124" stroke="rgba(20,19,23,.28)" stroke-dasharray="3 5"/>
    <line x1="0" x2="436" y1="72" y2="72" stroke="rgba(20,19,23,.1)"/>
    <path d="M4 124 L36 119 L68 109 L100 113 L132 98 L164 92 L196 83 L228 86 L260 69 L292 63 L324 50 L356 53 L388 36 L428 14" fill="none" stroke="#6C47F0" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="4" cy="124" r="4" fill="#F1F1F3" stroke="#6C47F0" stroke-width="2"/>
    <circle cx="428" cy="14" r="6" fill="#6C47F0"/>
  </svg>
  <h1 class="ticker" id="ticker">GYSE</h1>
  <p id="lead">Strength, as an index. Every top set you log moves your own line.</p>
  <a class="btn primary" id="open" href="gyse://">Open in GYSE</a>
  <a class="btn secondary" href="/">What is GYSE?</a>
  <p class="note">GYSE is coming soon to the App Store. If the button does nothing, the app isn't on this iPhone yet.</p>
</main>
<script>
  // Tickers are 1–8 letters. Anything else is ignored, and the value is only ever set as text.
  const raw = (new URLSearchParams(location.search).get("t") || "").replace(/^[$@]/, "");
  const ticker = /^[A-Za-z]{1,8}$/.test(raw) ? raw.toUpperCase() : "";
  if (ticker) {
    document.getElementById("ticker").textContent = "$" + ticker;
    document.getElementById("lead").textContent = "Follow $" + ticker + "'s strength index on GYSE.";
    document.getElementById("open").href = "gyse://profile/" + ticker.toLowerCase();
    document.title = "$" + ticker + " on GYSE";
  }
</script>
</body>
</html>
