<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-wANhRcye7sv7jfEJhtD+bYlabubPgrwWtyvA01Y7I0k='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Follow on GYSE</title>
<meta name="description" content="Strength, as an index. Follow a friend's GYSE ticker.">
<meta property="og:title" content="Follow me on GYSE">
<meta property="og:description" content="I track my strength as an index. Follow my line on GYSE.">
<meta property="og:image" content="https://gyse.app/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111114">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Same tokens as the homepage: the app's charcoal and purple. */
  @font-face { font-family: "Instrument Sans"; src: url(/assets/fonts/instrument-sans-var.woff2) format("woff2"); font-weight: 400 700; font-display: swap; }
  @font-face { font-family: "Archivo"; src: url(/assets/fonts/archivo-var.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root { color-scheme: dark; --bg:#111114; --text:#F5F4F7; --body:#B1ABBD; --muted:#8F899B; --line:rgba(255,255,255,.1); --btn:#7C4DF0; --violet:#A78BFA; --lilac:#CBB5FF; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100svh; color: var(--text); -webkit-font-smoothing: antialiased;
         background: radial-gradient(90% 50% at 50% 30%, rgba(139,92,246,.18), transparent 70%), var(--bg);
         font: 17px/1.6 "Instrument Sans", -apple-system, system-ui, sans-serif; }
  ::selection { background: rgba(139,92,246,.5); color: #fff; }
  :focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 6px; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 22px 56px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 600; font-size: 18px; letter-spacing: .01em; }
  .brand svg { width: 28px; height: 28px; }
  .line { display: block; width: 100%; height: auto; margin: 64px 0 32px; overflow: visible; }
  .ticker { font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 700; color: var(--lilac); font-size: clamp(40px, 13vw, 64px); line-height: 1.02; letter-spacing: -.01em; margin: 0; word-break: break-all; }
  p { color: var(--body); margin: 16px 0 0; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; text-decoration: none; font-weight: 600; margin-top: 12px;
         transition: transform 160ms cubic-bezier(.23,1,.32,1), background-color 160ms ease; }
  .btn:active { transform: scale(.97); }
  .primary { background: var(--btn); color: #fff; margin-top: 36px; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 30px -10px rgba(139,92,246,.7); }
  .secondary { background: rgba(255,255,255,.06); color: var(--text); }
  @media (hover: hover) and (pointer: fine) { .primary:hover { background: #8656F4; } .secondary:hover { background: rgba(255,255,255,.1); } }
  .note { font-size: 14px; margin-top: 28px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" aria-label="GYSE home">
    <svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1F1C24"/><path d="M7.5 18.5l4.6-5.6 3.8 2.8 5-6.9M17.7 8.8h3.2V12" fill="none" stroke="#A78BFA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    GYSE
  </a>
  <svg class="line" viewBox="0 0 436 140" aria-hidden="true">
    <line x1="0" x2="436" y1="124" y2="124" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 5"/>
    <line x1="0" x2="436" y1="72" y2="72" stroke="rgba(255,255,255,.07)"/>
    <path d="M4 124 L36 119 L68 109 L100 113 L132 98 L164 92 L196 83 L228 86 L260 69 L292 63 L324 50 L356 53 L388 36 L428 14" fill="none" stroke="#A78BFA" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="4" cy="124" r="4" fill="#111114" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="428" cy="14" r="10" fill="#8B5CF6" fill-opacity=".2"/><circle cx="428" cy="14" r="6" fill="#8B5CF6"/>
  </svg>
  <h1 class="ticker" id="ticker">GYSE</h1>
  <p id="lead">Strength, as an index. Every top set you log moves your own line.</p>
  <a class="btn primary" id="open" href="gyse://">Open in GYSE</a>
  <a class="btn secondary" href="/">What is GYSE?</a>
  <p class="note">GYSE is coming soon to the App Store. If the button does nothing, the app isn't on this iPhone yet.</p>
</main>
<script>
  // Tickers are 1–8 letters. Anything else is ignored, and the value is only ever set as text.
  const raw = (new URLSearchParams(location.search).get("t") || "").replace(/^[$@]/, "");
  const ticker = /^[A-Za-z]{1,8}$/.test(raw) ? raw.toUpperCase() : "";
  if (ticker) {
    document.getElementById("ticker").textContent = "$" + ticker;
    document.getElementById("lead").textContent = "Follow $" + ticker + "'s strength index on GYSE.";
    document.getElementById("open").href = "gyse://profile/" + ticker.toLowerCase();
    document.title = "$" + ticker + " on GYSE";
  }
  // Launch day: /assets/store.json holds the App Store link, and the note turns into a download link.
  fetch("/assets/store.json", { cache: "no-cache" }).then(r => (r.ok ? r.json() : null)).then(cfg => {
    const url = cfg && cfg.appStoreUrl;
    if (typeof url !== "string" || !/^https:\/\/apps\.apple\.com\/[\w\-./?=&%]+$/.test(url)) return;
    const note = document.querySelector(".note"), a = document.createElement("a");
    a.className = "btn secondary"; a.href = url; a.textContent = "Download on the App Store";
    note.textContent = "Don't have GYSE yet? It's free on the App Store.";
    note.after(a);
  }).catch(() => {});
</script>
</body>
</html>
